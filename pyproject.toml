[project]
name = "brandmeister-tools"
version = "0.1.0"
description = "Tools rund um das Brandmeister DMR/Tetra-Netzwerk"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "folium>=0.16",
    "platformdirs>=4.0",
]

[project.scripts]
bm-rail = "bmtools.rail.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bmtools*"]
