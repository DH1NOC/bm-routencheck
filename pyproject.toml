[project]
name = "bm-routencheck"
version = "0.1.2"
description = "Erreichbare Brandmeister-DMR-Relais entlang einer Route (Bahn, Auto, Rad)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "folium>=0.16",
    "platformdirs>=4.0",
    "questionary>=2.0",
    # GUI-Fenster (GUI-UMBAU.md): natives Fenster mit System-Webview;
    # unter Linux ist zusätzlich ein Backend nötig (GTK/WebKit2 oder
    # QtWebEngine) — ohne fällt das Tool mit Hinweis auf Terminal zurück.
    # >=5.1: webview.start(icon=…) fürs Fenster-Icon der Linux-Backends
    "pywebview>=5.1",
    "numpy>=1.26",
    "pillow>=10.0",
    # PDF-Export (U8, GUI-UMBAU.md): reines Python-Paket, keine
    # Systembibliotheken; Helvetica deckt die Umlaute ab.
    "reportlab>=4.0",
    # Zeitzonen-Datenbank: Windows bringt keine mit — ohne tzdata stürzt
    # ZoneInfo("Europe/Berlin") dort ab (Beta-Befund 2026-07-17); unter
    # Linux/macOS nur ungenutzter Fallback zur Systemdatenbank.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
]

[project.scripts]
bmtools = "bmtools.cli:main"
bm-bahn = "bmtools.rail.cli:main"
bm-auto = "bmtools.road.cli:main_car"
bm-rad = "bmtools.road.cli:main_bike"
# Englische Aliasse (Kompatibilität)
bm-rail = "bmtools.rail.cli:main"
bm-car = "bmtools.road.cli:main_car"
bm-bike = "bmtools.road.cli:main_bike"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bmtools*"]

[tool.setuptools.package-data]
# GUI-Frontend (lokal gebündelt, keine CDN-Zugriffe) inkl. Leaflet und
# Material-Symbols-Quellen samt Lizenzen (static/vendor/)
"bmtools.gui" = ["static/*", "static/vendor/material-symbols/*",
                 "static/vendor/material-symbols/svg/*",
                 "static/vendor/leaflet/*",
                 "static/vendor/leaflet/images/*"]

# ---------------------------------------------------------------------------
# Qualitätssicherung: `make qs` führt Lint, Typprüfung und Tests aus.
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I Import-Sortierung, UP Modernisierung,
# B bugbear (echte Fehlerquellen), SIM Vereinfachungen, RUF Ruff-eigene.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "SIM108",  # ternary statt if/else nicht erzwingen (Lesbarkeit)
    "SIM117",  # verschachtelte with-Blöcke sind teils bewusst getrennt
    "RUF001",  # deutsche Typografie (Gedankenstrich, ❯) ist gewollt,
    "RUF002",  # auch in Docstrings …
    "RUF003",  # … und Kommentaren
]

[tool.ruff.lint.per-file-ignores]
# Konsolen-Streams der Windowed-Exe leben prozesslang — kein with-Block.
"packaging/entry.py" = ["SIM115"]

[tool.ruff.lint.isort]
known-first-party = ["bmtools"]

[tool.mypy]
python_version = "3.12"
strict = true
# Bewusste Lockerungen gegenüber strict (dokumentiert, nicht schleichend):
disallow_untyped_calls = false     # rich/questionary sind teils ungetypt
warn_return_any = false            # JSON-Antworten (Any) werden durchgereicht
packages = ["bmtools", "tests"]

[[tool.mypy.overrides]]
# Bibliotheken ohne Typ-Stubs
module = ["folium.*", "questionary.*", "PIL.*", "webview.*",
          "objc.*", "WebKit.*", "AppKit.*", "reportlab.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests: inhaltlich mitprüfen, aber ohne Annotationszwang für jede
# Testfunktion ("-> None" überall wäre Formalismus ohne Erkenntnis).
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -q"

[tool.coverage.run]
source = ["bmtools"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Untergrenze bewusst auf erreichtem Niveau: Kernlogik (Parser, Geometrie,
# Auswertung, API-Client) ist getestet; interaktive CLIs, Karten-/HTML-
# Rendering und Geländemodell (Netz/Grafik) drücken den Schnitt — die
# blind auf 100 % zu treiben wäre Statistik-Kosmetik.
fail_under = 55

[tool.coverage.html]
directory = "out/coverage"
