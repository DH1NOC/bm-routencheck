# Release: manuell starten unter Actions → Release → "Run workflow".
#
# Der gewählte Branch bestimmt die Art des Releases:
#   main           → regulärer Release (Version wird in pyproject.toml
#                    committet und getaggt, z. B. v0.2.0)
#   Feature-Branch → Beta (nur Tag, z. B. v0.2.0-beta.1; die Versionsnummer
#                    im Branch bleibt unangetastet)
#
# Der Versionssprung erhöht die Version aus pyproject.toml:
#   major = Featureversion (0.1.0 → 0.2.0)
#   minor = Patch          (0.1.0 → 0.1.1)
#
# Assets: Quell-ZIP sowie die GUI-Apps (A3, GUI-first):
#   Windows  BM-Routencheck.exe (windowed, Exe-Icon; Terminal-Aufruf
#            klinkt sich per AttachConsole in cmd/PowerShell ein)
#   macOS    BM-Routencheck.app im ZIP (Terminal über das Binary im
#            Bundle: BM-Routencheck.app/Contents/MacOS/BM-Routencheck)
#   Linux    bmtools als tar.gz (GUI startet aus dem Terminal oder
#            Dateimanager; Fenster-Icon kommt aus dem Paket)
# Das macOS-Bundle wird signiert und notarisiert, sofern die Secrets
# APPLE_CERT_P12, APPLE_CERT_PASSWORD, APPLE_ID, APPLE_TEAM_ID und
# APPLE_APP_PASSWORD hinterlegt sind (siehe DEVELOPER.md, Abschnitt Releases).
name: Release

on:
  workflow_dispatch:
    inputs:
      sprung:
        description: "major = Featureversion erhöhen, minor = Patch erhöhen"
        required: true
        type: choice
        options:
          - major
          - minor

permissions:
  contents: write

# Nie zwei Releases gleichzeitig (Versionsberechnung wäre sonst ein Wettlauf).
concurrency: release

jobs:
  # Kein Release ohne grüne QS — gleiche Prüfungen wie bei jedem Push.
  qs:
    uses: ./.github/workflows/qs.yml

  version:
    name: Version bestimmen und taggen
    needs: qs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.rechnen.outputs.version }}     # PEP 440, z. B. 0.2.0b1
      label: ${{ steps.rechnen.outputs.label }}         # lesbar, z. B. 0.2.0-beta.1
      tag: ${{ steps.rechnen.outputs.tag }}             # z. B. v0.2.0-beta.1
      prerelease: ${{ steps.rechnen.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # alle Tags, für die Beta-Zählung
      - name: Version berechnen, taggen, bei Release committen
        id: rechnen
        env:
          SPRUNG: ${{ inputs.sprung }}
        run: |
          set -euo pipefail

          BASIS=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          IFS=. read -r HAUPT FEATURE PATCH <<< "$BASIS"
          if [ "$SPRUNG" = "major" ]; then
            FEATURE=$((FEATURE + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi
          VERSION="$HAUPT.$FEATURE.$PATCH"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$GITHUB_REF_NAME" = "main" ]; then
            LABEL="$VERSION"
            TAG="v$VERSION"
            PRERELEASE=false
            sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
            git commit -am "Release $VERSION"
            git tag "$TAG"
            git push origin HEAD:main "$TAG"
          else
            # Nächste Beta-Nummer = höchste vorhandene + 1. (Tags zählen
            # bricht, sobald alte Beta-Tags gelöscht wurden — dann kollidiert
            # die Nummer mit einer bestehenden; Befund 2026-07-17.)
            N=$(git tag --list "v$VERSION-beta.*" \
              | sed 's/.*-beta\.//' | sort -n | tail -1)
            N=$(( ${N:-0} + 1 ))
            LABEL="$VERSION-beta.$N"
            TAG="v$LABEL"
            VERSION="${VERSION}b$N"  # PEP-440-Schreibweise für pyproject.toml
            PRERELEASE=true
            git tag "$TAG"
            git push origin "$TAG"
          fi

          {
            echo "version=$VERSION"
            echo "label=$LABEL"
            echo "tag=$TAG"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Binary ${{ matrix.plattform }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            plattform: linux-x64
          - os: windows-latest
            plattform: windows-x64
          - os: macos-latest
            plattform: macos-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash  # einheitliche Skripte, auch auf Windows (Git Bash)
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Version eintragen (bei Beta nur lokal, nicht committet)
        run: |
          sed -i.bak 's/^version = ".*"/version = "${{ needs.version.outputs.version }}"/' pyproject.toml
          rm pyproject.toml.bak
      - name: Abhängigkeiten installieren
        run: |
          pip install . pyinstaller
          # Linux-GUI (Nutzerfestlegung 2026-07-21): Qt-Backend wird ins
          # Binary gebündelt (PyQt6 + WebEngine) — ohne Bundle kann das
          # PyInstaller-Binary nie ein Fenster öffnen, System-Pakete des
          # Nutzers erreichen sein eingebautes Python nicht
          # (Beta-Befund 2026-07-21, Mint 22.3: Dateimanager-Start tat
          # nichts). Preis: deutlich größeres tar.gz.
          if [ "$RUNNER_OS" = "Linux" ]; then
            pip install "pywebview[qt]"
            # Werden ins Binary gebündelt (--add-binary im Build): Qt ≥ 6.5
            # dlopen't libxcb-cursor0, und GTK-Desktops wie Mint/Cinnamon
            # haben es nicht an Bord (Beta-Befund 2026-07-21, beta.5).
            sudo apt-get -yq install libxcb-cursor0 libxkbcommon-x11-0 \
              > /dev/null
          fi

      - name: Signatur-Zertifikat importieren (macOS)
        if: runner.os == 'macOS'
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          CERT_PASSWORT: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$CERT_P12" ]; then
            echo "::warning::Secret APPLE_CERT_P12 fehlt — macOS-Binary bleibt unsigniert."
            exit 0
          fi
          KEYCHAIN_PW=$(uuidgen)
          echo "$CERT_P12" | base64 -d > "$RUNNER_TEMP/zertifikat.p12"
          security create-keychain -p "$KEYCHAIN_PW" build.keychain
          security set-keychain-settings -lut 1800 build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain
          security import "$RUNNER_TEMP/zertifikat.p12" -k build.keychain \
            -P "$CERT_PASSWORT" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PW" build.keychain > /dev/null
          IDENTITAET=$(security find-identity -v -p codesigning build.keychain \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          echo "SIGNIER_IDENTITAET=$IDENTITAET" >> "$GITHUB_ENV"

      - name: App bauen (PyInstaller)
        run: |
          set -euo pipefail
          # --collect-all tzdata: zoneinfo lädt das Paket dynamisch
          # (string-basiert) — die statische Analyse sieht es nicht.
          # --collect-data bmtools: GUI-Frontend (static/ inkl. Leaflet
          # und Material Symbols samt Lizenzen) ins Binary.
          # --copy-metadata bm-routencheck: Ohne die Paket-Metadaten
          # kennt das Binary seine eigene Version nicht — importlib.
          # metadata findet dann nichts, und der Updater müsste
          # schweigen. Der Rauchtest unten prüft das ausdrücklich.
          GEMEINSAM=(--collect-submodules bmtools --collect-data bmtools
                     --copy-metadata bm-routencheck
                     --collect-data folium --collect-data branca
                     --collect-all tzdata)
          case "$RUNNER_OS" in
            macOS)
              # onedir statt onefile: ein onefile-.app entpackt sich bei
              # jedem Start selbst (spürbar träge); das Bundle ist ohnehin
              # ein Ordner. --windowed erzeugt das .app, der Terminal-
              # Aufruf läuft über das Binary im Bundle.
              EXTRA=()
              if [ -n "${SIGNIER_IDENTITAET:-}" ]; then
                # Signiert auch alle eingebetteten Bibliotheken (Pflicht
                # für Notarisierung mit Hardened Runtime).
                EXTRA+=(--codesign-identity "$SIGNIER_IDENTITAET"
                        --osx-entitlements-file packaging/entitlements.plist)
              fi
              pyinstaller --windowed --name "BM-Routencheck" \
                --osx-bundle-identifier de.dh1noc.bm-routencheck \
                --icon packaging/icon/icon.icns \
                "${GEMEINSAM[@]}" ${EXTRA[@]+"${EXTRA[@]}"} \
                packaging/entry.py ;;
            Windows)
              # Eine windowed Exe (Nutzerfestlegung 2026-07-21): kein
              # Konsolenfenster beim Doppelklick; Terminal-Ausgabe über
              # den AttachConsole-Shim in packaging/entry.py.
              pyinstaller --onefile --windowed --name "BM-Routencheck" \
                --icon packaging/icon/icon.ico \
                "${GEMEINSAM[@]}" packaging/entry.py ;;
            Linux)
              # --hidden-import webview.platforms.qt: stellt sicher, dass
              # die Analyse das Qt-Backend sieht und die PyQt6-/qtpy-Hooks
              # das WebEngine-Bundle einsammeln. --add-binary: die beiden
              # xcb-Helfer, die Qt zur Laufzeit dlopen't und die auf
              # GTK-Desktops (Mint/Cinnamon) fehlen — klein und ohne
              # GPU-/Treiberbezug, dürfen daher mitreisen.
              pyinstaller --onefile --name bmtools \
                --hidden-import webview.platforms.qt \
                --add-binary /usr/lib/x86_64-linux-gnu/libxcb-cursor.so.0:. \
                --add-binary /usr/lib/x86_64-linux-gnu/libxkbcommon-x11.so.0:. \
                "${GEMEINSAM[@]}" packaging/entry.py ;;
          esac

      - name: Binary rauchtesten
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            macOS)   BIN="dist/BM-Routencheck.app/Contents/MacOS/BM-Routencheck" ;;
            Windows) BIN="dist/BM-Routencheck.exe" ;;
            Linux)   BIN=dist/bmtools ;;
          esac
          # Windows: Die windowed Exe hat im CI keine sichtbare Ausgabe,
          # geprüft werden Exit-Codes (Importe, tzdata, Datenpakete).
          "$BIN" --help
          # Kennt das Binary seine eigene Version? Das ist die Grundlage
          # jeder Update-Entscheidung (Downgrade-Sperre!) und im
          # gefrorenen Zustand NICHT selbstverständlich: importlib.
          # metadata findet nichts ohne --copy-metadata. Im Quellbaum
          # sieht alles richtig aus, im Artefakt nicht — deshalb hier
          # gegen die tatsächlich gebaute Version prüfen.
          GEMELDET="$("$BIN" --version)"
          echo "Gemeldete Version: $GEMELDET"
          if [ "$GEMELDET" != "BM-Routencheck ${{ needs.version.outputs.version }}" ]; then
            echo "::error::Binary meldet '$GEMELDET', gebaut wurde \
          ${{ needs.version.outputs.version }}"
            exit 1
          fi
          # PYTHONTZPATH leer: erzwingt den tzdata-Fallback auch auf
          # Linux/macOS — bahn lädt ZoneInfo("Europe/Berlin") beim Import
          # (genau der Windows-Absturz aus dem Beta-Test 2026-07-17).
          PYTHONTZPATH= "$BIN" bahn --help > /dev/null
          "$BIN" auto --help > /dev/null
          "$BIN" rad --help > /dev/null
          if [ "$RUNNER_OS" = "Linux" ]; then
            # Regressionstest zum Beta-Befund 2026-07-21: Ohne gebündeltes
            # Qt beendet sich das Binary unter einem Display sofort mit
            # Code 2 („GUI nicht verfügbar“). Mit GUI läuft es, bis
            # timeout es beendet (Exit 124) — nur das gilt als bestanden.
            # --no-sandbox: Ubuntu-24.04-Runner blocken die User-Namespaces
            # der Chromium-Sandbox von QtWebEngine.
            # Nur die GPU-/X-Basisbibliotheken, die jeder Desktop hat —
            # bewusst OHNE libxcb-cursor0/libxkbcommon-x11-0: Die sind ins
            # Binary gebündelt, und der Test simuliert damit einen
            # GTK-Desktop wie Mint, dem sie fehlen (Beta-Befund
            # 2026-07-21, beta.5).
            sudo apt-get -yq remove libxcb-cursor0 libxkbcommon-x11-0 \
              > /dev/null 2>&1 || true
            sudo apt-get -yq install xvfb libegl1 libopengl0 \
              libxkbcommon0 libxcb-icccm4 libxcb-keysyms1 libxcb-randr0 \
              libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
              libxcb-xkb1 > /dev/null
            set +e
            QTWEBENGINE_CHROMIUM_FLAGS="--no-sandbox" \
              xvfb-run -a timeout 20 "$BIN"
            code=$?
            set -e
            if [ "$code" -ne 124 ]; then
              echo "::error::GUI-Start unter Xvfb: Exit $code statt 124 — Qt-Bundle prüfen."
              exit 1
            fi
          fi

      - name: Notarisieren (macOS)
        if: runner.os == 'macOS' && env.SIGNIER_IDENTITAET != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORT: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail

          # notarytool meldet auch abgelehnte Einreichungen nicht immer als
          # Fehler-Exitcode — daher Status explizit prüfen und bei allem
          # außer "Accepted" das Prüfprotokoll ausgeben und abbrechen.
          notarisieren() {
            local ergebnis id status
            ergebnis=$(xcrun notarytool submit "$1" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORT" --wait --output-format json)
            id=$(echo "$ergebnis" | jq -r .id)
            status=$(echo "$ergebnis" | jq -r .status)
            echo "Notarisierung $1: $status (Submission $id)"
            if [ "$status" != "Accepted" ]; then
              xcrun notarytool log "$id" \
                --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_APP_PASSWORT" || true
              exit 1
            fi
          }

          ditto -c -k --keepParent "dist/BM-Routencheck.app" \
            "$RUNNER_TEMP/notarisierung.zip"
          notarisieren "$RUNNER_TEMP/notarisierung.zip"

      - name: Ticket antackern und Gatekeeper prüfen (macOS)
        if: runner.os == 'macOS' && env.SIGNIER_IDENTITAET != ''
        run: |
          set -euo pipefail
          # Stapling heftet das Notarisierungs-Ticket ans Bundle — die
          # Gatekeeper-Prüfung beim Nutzer läuft dann offline. Ersetzt
          # die frühere CDN-Warteschleife (Beta-Befund 2026-07-17: Ticket
          # direkt nach der Notarisierung noch nicht abrufbar); stapler
          # braucht dasselbe CDN, daher hier die Wiederholungen.
          for versuch in $(seq 1 20); do
            if xcrun stapler staple "dist/BM-Routencheck.app"; then
              spctl --assess --type execute -vv "dist/BM-Routencheck.app"
              exit 0
            fi
            echo "Ticket noch nicht verteilt — warte 15 s (Versuch $versuch/20)"
            sleep 15
          done
          echo "::error::Stapling nach 5 Minuten nicht möglich."
          exit 1

      - name: Paket schnüren
        env:
          LABEL: ${{ needs.version.outputs.label }}
          PLATTFORM: ${{ matrix.plattform }}
        run: |
          set -euo pipefail
          mkdir -p out/release
          case "$PLATTFORM" in
            windows-*) cp "dist/BM-Routencheck.exe" \
                         "out/release/BM-Routencheck-$LABEL-$PLATTFORM.exe" ;;
            linux-*)
              # Binary + Icon + .desktop-Vorlage: Ein nacktes ELF-Binary
              # hat im Dateimanager nie ein Icon — das kommt unter Linux
              # aus einer .desktop-Datei (Beta-Befund 2026-07-21).
              mkdir -p tarinhalt
              cp dist/bmtools tarinhalt/
              cp bmtools/gui/static/icon.png tarinhalt/icon.png
              printf '%s\n' \
                "[Desktop Entry]" \
                "Type=Application" \
                "Name=BM-Routencheck" \
                "Comment=Welche DMR- und FM-Relais erreichst du entlang der Route?" \
                "Exec=/PFAD/ANPASSEN/bmtools" \
                "Icon=/PFAD/ANPASSEN/icon.png" \
                "Terminal=false" \
                "Categories=Utility;Network;HamRadio;" \
                > tarinhalt/BM-Routencheck.desktop
              printf '%s\n' \
                "BM-Routencheck (Linux)" \
                "" \
                "Start: ./bmtools — per Doppelklick im Dateimanager oder im" \
                "Terminal. Ohne Argumente öffnet sich das Programmfenster;" \
                "alle Terminal-Kommandos funktionieren wie gewohnt" \
                "(./bmtools bahn --help)." \
                "" \
                "Programmstarter mit Icon (optional): In der Datei" \
                "BM-Routencheck.desktop die beiden /PFAD/ANPASSEN/-Einträge" \
                "auf den Entpack-Ort ändern und die Datei nach" \
                "~/.local/share/applications/ kopieren — dann erscheint" \
                "BM-Routencheck mit Icon im Startmenü." \
                > tarinhalt/LIESMICH.txt
              tar -C tarinhalt -czf "out/release/bmtools-$LABEL-$PLATTFORM.tar.gz" \
                bmtools icon.png BM-Routencheck.desktop LIESMICH.txt ;;
            macos-*)
              # ZIP mit dem .app-Bundle + Hinweis-Datei (Nutzerfestlegung
              # 2026-07-17: kein Installer, kein DMG; 2026-07-21: nur das
              # .app im ZIP). ditto erhält Symlinks und Signatur im Bundle.
              mkdir -p zipinhalt
              ditto "dist/BM-Routencheck.app" "zipinhalt/BM-Routencheck.app"
              printf '%s\n' \
                "BM-Routencheck" \
                "" \
                "Die App am besten in den Ordner Programme ziehen und per" \
                "Doppelklick starten. Sie ist mit Developer ID signiert und" \
                "von Apple notarisiert — es ist keine Gatekeeper-Ausnahme" \
                "nötig." \
                "" \
                "Terminal-Nutzung (optional): Das Binary im Bundle versteht" \
                "alle Kommandos, z. B." \
                "    /Applications/BM-Routencheck.app/Contents/MacOS/BM-Routencheck bahn --help" \
                "Tipp für häufige Nutzung ein Alias in ~/.zshrc:" \
                "    alias bmtools='/Applications/BM-Routencheck.app/Contents/MacOS/BM-Routencheck'" \
                > zipinhalt/LIESMICH.txt
              ditto -c -k zipinhalt "out/release/BM-Routencheck-$LABEL-$PLATTFORM.zip" ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.plattform }}
          path: out/release/*
          if-no-files-found: error

  release:
    name: Release veröffentlichen
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          path: out/release
          merge-multiple: true
      - name: Quell-ZIP packen
        env:
          LABEL: ${{ needs.version.outputs.label }}
        run: |
          git archive --format=zip --prefix="bm-routencheck-$LABEL/" \
            -o "out/release/bm-routencheck-$LABEL-quellen.zip" HEAD
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Update-Manifest signieren
        env:
          UPDATE_SIGN_KEY: ${{ secrets.UPDATE_SIGN_KEY }}
          # PEP-440-Form (0.4.1b1), nicht das Label: Der Client
          # vergleicht gegen seine eigene --version, und die kommt aus
          # den Paket-Metadaten.
          VERSION: ${{ needs.version.outputs.version }}
          LABEL: ${{ needs.version.outputs.label }}
        run: |
          set -euo pipefail
          if [ -z "${UPDATE_SIGN_KEY:-}" ]; then
            echo "::error::Secret UPDATE_SIGN_KEY fehlt. Ohne signiertes \
          Manifest bekämen die Clients dieses Release nie angeboten — sie \
          würden stumm auf der alten Version bleiben. Schlüssel erzeugen: \
          packaging/schluessel_erzeugen.py, dann unter Settings → Secrets \
          → Actions hinterlegen."
            exit 1
          fi
          pip install --quiet cryptography
          # Nur die eigenständigen Programme kommen ins Manifest — das
          # Quell-ZIP ist nichts, womit sich eine Installation ersetzen
          # ließe. Die Plattformnamen müssen zu bmtools/update/ziel.py
          # passen (sys.platform + platform.machine()).
          python packaging/manifest_signieren.py "$VERSION" out/release \
            "windows-x64=out/release/BM-Routencheck-$LABEL-windows-x64.exe" \
            "macos-arm64=out/release/BM-Routencheck-$LABEL-macos-arm64.zip" \
            "linux-x64=out/release/bmtools-$LABEL-linux-x64.tar.gz"

      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          LABEL: ${{ needs.version.outputs.label }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          FLAGS=(--title "bm-routencheck $LABEL" --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "$TAG" out/release/* "${FLAGS[@]}"
