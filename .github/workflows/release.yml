# Release: manuell starten unter Actions → Release → "Run workflow".
#
# Der gewählte Branch bestimmt die Art des Releases:
#   main           → regulärer Release (Version wird in pyproject.toml
#                    committet und getaggt, z. B. v0.2.0)
#   Feature-Branch → Beta (nur Tag, z. B. v0.2.0-beta.1; die Versionsnummer
#                    im Branch bleibt unangetastet)
#
# Der Versionssprung erhöht die Version aus pyproject.toml:
#   major = Featureversion (0.1.0 → 0.2.0)
#   minor = Patch          (0.1.0 → 0.1.1)
#
# Assets: Quell-ZIP sowie Binaries für Windows, Linux und macOS.
# Das macOS-Binary wird signiert und notarisiert, sofern die Secrets
# APPLE_CERT_P12, APPLE_CERT_PASSWORD, APPLE_ID, APPLE_TEAM_ID und
# APPLE_APP_PASSWORD hinterlegt sind (siehe README, Abschnitt Releases).
name: Release

on:
  workflow_dispatch:
    inputs:
      sprung:
        description: "major = Featureversion erhöhen, minor = Patch erhöhen"
        required: true
        type: choice
        options:
          - major
          - minor

permissions:
  contents: write

# Nie zwei Releases gleichzeitig (Versionsberechnung wäre sonst ein Wettlauf).
concurrency: release

jobs:
  # Kein Release ohne grüne QS — gleiche Prüfungen wie bei jedem Push.
  qs:
    uses: ./.github/workflows/qs.yml

  version:
    name: Version bestimmen und taggen
    needs: qs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.rechnen.outputs.version }}     # PEP 440, z. B. 0.2.0b1
      label: ${{ steps.rechnen.outputs.label }}         # lesbar, z. B. 0.2.0-beta.1
      tag: ${{ steps.rechnen.outputs.tag }}             # z. B. v0.2.0-beta.1
      prerelease: ${{ steps.rechnen.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # alle Tags, für die Beta-Zählung
      - name: Version berechnen, taggen, bei Release committen
        id: rechnen
        env:
          SPRUNG: ${{ inputs.sprung }}
        run: |
          set -euo pipefail

          BASIS=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          IFS=. read -r HAUPT FEATURE PATCH <<< "$BASIS"
          if [ "$SPRUNG" = "major" ]; then
            FEATURE=$((FEATURE + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi
          VERSION="$HAUPT.$FEATURE.$PATCH"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$GITHUB_REF_NAME" = "main" ]; then
            LABEL="$VERSION"
            TAG="v$VERSION"
            PRERELEASE=false
            sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
            git commit -am "Release $VERSION"
            git tag "$TAG"
            git push origin HEAD:main "$TAG"
          else
            # Nächste Beta-Nummer = höchste vorhandene + 1. (Tags zählen
            # bricht, sobald alte Beta-Tags gelöscht wurden — dann kollidiert
            # die Nummer mit einer bestehenden; Befund 2026-07-17.)
            N=$(git tag --list "v$VERSION-beta.*" \
              | sed 's/.*-beta\.//' | sort -n | tail -1)
            N=$(( ${N:-0} + 1 ))
            LABEL="$VERSION-beta.$N"
            TAG="v$LABEL"
            VERSION="${VERSION}b$N"  # PEP-440-Schreibweise für pyproject.toml
            PRERELEASE=true
            git tag "$TAG"
            git push origin "$TAG"
          fi

          {
            echo "version=$VERSION"
            echo "label=$LABEL"
            echo "tag=$TAG"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Binary ${{ matrix.plattform }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            plattform: linux-x64
          - os: windows-latest
            plattform: windows-x64
          - os: macos-latest
            plattform: macos-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash  # einheitliche Skripte, auch auf Windows (Git Bash)
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Version eintragen (bei Beta nur lokal, nicht committet)
        run: |
          sed -i.bak 's/^version = ".*"/version = "${{ needs.version.outputs.version }}"/' pyproject.toml
          rm pyproject.toml.bak
      - name: Abhängigkeiten installieren
        run: pip install . pyinstaller

      - name: Signatur-Zertifikat importieren (macOS)
        if: runner.os == 'macOS'
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          CERT_PASSWORT: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$CERT_P12" ]; then
            echo "::warning::Secret APPLE_CERT_P12 fehlt — macOS-Binary bleibt unsigniert."
            exit 0
          fi
          KEYCHAIN_PW=$(uuidgen)
          echo "$CERT_P12" | base64 -d > "$RUNNER_TEMP/zertifikat.p12"
          security create-keychain -p "$KEYCHAIN_PW" build.keychain
          security set-keychain-settings -lut 1800 build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain
          security import "$RUNNER_TEMP/zertifikat.p12" -k build.keychain \
            -P "$CERT_PASSWORT" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PW" build.keychain > /dev/null
          IDENTITAET=$(security find-identity -v -p codesigning build.keychain \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          echo "SIGNIER_IDENTITAET=$IDENTITAET" >> "$GITHUB_ENV"

      - name: Binary bauen (PyInstaller)
        run: |
          set -euo pipefail
          EXTRA=()
          if [ -n "${SIGNIER_IDENTITAET:-}" ]; then
            # Signiert auch alle eingebetteten Bibliotheken (Pflicht für
            # Notarisierung mit Hardened Runtime).
            EXTRA+=(--codesign-identity "$SIGNIER_IDENTITAET"
                    --osx-entitlements-file packaging/entitlements.plist)
          fi
          # --collect-all tzdata: zoneinfo lädt das Paket dynamisch
          # (string-basiert) — die statische Analyse sieht es nicht.
          pyinstaller --onefile --name bmtools \
            --collect-submodules bmtools \
            --collect-data folium --collect-data branca \
            --collect-all tzdata \
            ${EXTRA[@]+"${EXTRA[@]}"} packaging/entry.py

      - name: Binary rauchtesten
        run: |
          set -euo pipefail
          BIN=dist/bmtools
          [ -f dist/bmtools.exe ] && BIN=dist/bmtools.exe
          "$BIN" --help
          # PYTHONTZPATH leer: erzwingt den tzdata-Fallback auch auf
          # Linux/macOS — bahn lädt ZoneInfo("Europe/Berlin") beim Import
          # (genau der Windows-Absturz aus dem Beta-Test 2026-07-17).
          PYTHONTZPATH= "$BIN" bahn --help > /dev/null
          "$BIN" auto --help > /dev/null
          "$BIN" rad --help > /dev/null

      - name: Notarisieren (macOS)
        if: runner.os == 'macOS' && env.SIGNIER_IDENTITAET != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORT: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail

          # notarytool meldet auch abgelehnte Einreichungen nicht immer als
          # Fehler-Exitcode — daher Status explizit prüfen und bei allem
          # außer "Accepted" das Prüfprotokoll ausgeben und abbrechen.
          notarisieren() {
            local ergebnis id status
            ergebnis=$(xcrun notarytool submit "$1" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORT" --wait --output-format json)
            id=$(echo "$ergebnis" | jq -r .id)
            status=$(echo "$ergebnis" | jq -r .status)
            echo "Notarisierung $1: $status (Submission $id)"
            if [ "$status" != "Accepted" ]; then
              xcrun notarytool log "$id" \
                --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_APP_PASSWORT" || true
              exit 1
            fi
          }

          ditto -c -k dist/bmtools "$RUNNER_TEMP/notarisierung.zip"
          notarisieren "$RUNNER_TEMP/notarisierung.zip"

      - name: Gatekeeper-Freigabe abwarten (macOS)
        if: runner.os == 'macOS' && env.SIGNIER_IDENTITAET != ''
        run: |
          set -euo pipefail
          # Beta-Befund 2026-07-17: Direkt nach der Notarisierung braucht
          # Apples CDN einige Minuten, bis das Ticket abrufbar ist — wer
          # sofort herunterlädt, sieht sonst "Apple konnte nicht
          # überprüfen …". Der Release wird erst freigegeben, wenn
          # Gatekeeper das Binary tatsächlich akzeptiert.
          for versuch in $(seq 1 20); do
            if spctl --assess --type install dist/bmtools 2>/dev/null; then
              spctl --assess --type install -vv dist/bmtools
              exit 0
            fi
            echo "Ticket noch nicht verteilt — warte 15 s (Versuch $versuch/20)"
            sleep 15
          done
          echo "::error::Gatekeeper akzeptiert das Binary nach 5 Minuten nicht."
          exit 1

      - name: Paket schnüren
        env:
          LABEL: ${{ needs.version.outputs.label }}
          PLATTFORM: ${{ matrix.plattform }}
        run: |
          set -euo pipefail
          mkdir -p out/release
          case "$PLATTFORM" in
            windows-*) cp dist/bmtools.exe "out/release/bmtools-$LABEL-$PLATTFORM.exe" ;;
            linux-*)   tar -C dist -czf "out/release/bmtools-$LABEL-$PLATTFORM.tar.gz" bmtools ;;
            macos-*)
              # ZIP mit Binary + Hinweis-Datei (Nutzerfestlegung 2026-07-17:
              # kein Installer, kein DMG). Die LIESMICH erklärt die
              # Gatekeeper-Meldung beim Doppelklick — bmtools ist ein
              # Terminalprogramm, gestartet wird im Terminal.
              mkdir -p zipinhalt
              # -X: ohne erweiterte Attribute (sonst ._-Dateien im ZIP)
              cp -X dist/bmtools zipinhalt/bmtools
              printf '%s\n' \
                "bmtools — BM-Routencheck" \
                "" \
                "bmtools ist ein Terminalprogramm und wird im Terminal gestartet:" \
                "    chmod +x bmtools && ./bmtools" \
                "" \
                "WICHTIG: Nicht per Doppelklick im Finder starten. macOS zeigt" \
                "dabei bei jedem Terminalprogramm die Meldung 'Apple konnte" \
                "nicht überprüfen, ob bmtools frei von Schadsoftware ist'." \
                "Das ist kein Signaturproblem: Das Binary ist mit Developer ID" \
                "signiert und von Apple notarisiert — Gatekeeper behandelt per" \
                "Doppelklick nur .app-Bundles als Apps." \
                > zipinhalt/LIESMICH.txt
              ditto -c -k zipinhalt "out/release/bmtools-$LABEL-$PLATTFORM.zip" ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.plattform }}
          path: out/release/*
          if-no-files-found: error

  release:
    name: Release veröffentlichen
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          path: out/release
          merge-multiple: true
      - name: Quell-ZIP packen
        env:
          LABEL: ${{ needs.version.outputs.label }}
        run: |
          git archive --format=zip --prefix="bm-routencheck-$LABEL/" \
            -o "out/release/bm-routencheck-$LABEL-quellen.zip" HEAD
      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          LABEL: ${{ needs.version.outputs.label }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          FLAGS=(--title "bm-routencheck $LABEL" --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "$TAG" out/release/* "${FLAGS[@]}"
